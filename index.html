<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Birthday Surprise</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ffd6e7, #e4d7ff);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 520px;
    background: white;
    padding: 30px;
    border-radius: 25px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
}

h1 {
    text-align: center;
    color: #553365;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

label {
    display: block;
    margin-top: 15px;
    margin-bottom: 7px;
    font-weight: bold;
    color: #4d3a55;
}

input,
textarea,
select {
    width: 100%;
    padding: 14px;
    border: 1px solid #ddd;
    border-radius: 12px;
    font-size: 16px;
    font-family: inherit;
}

textarea {
    min-height: 130px;
    resize: vertical;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 20px;
    border: none;
    border-radius: 12px;
    background: #754c8f;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.secondary {
    background: #ddd;
    color: #333;
}

.hidden {
    display: none;
}

.error {
    text-align: center;
    color: #d33;
    margin-top: 12px;
    font-weight: bold;
}

.heart {
    text-align: center;
    font-size: 65px;
    animation: beat 1.2s infinite;
}

.message {
    white-space: pre-line;
    text-align: center;
    line-height: 1.8;
    color: #555;
}

.photo-preview {
    display: flex;
    justify-content: center;
    margin-top: 20px;
}

.photo-preview img {
    max-width: 100%;
    max-height: 280px;
    border-radius: 18px;
}

@keyframes beat {

    50% {
        transform: scale(1.2);
    }

}

</style>

</head>

<body>


<div class="card">


<!-- ============================= -->
<!-- CREATE PAGE -->
<!-- ============================= -->

<div id="createPage">

<h1>Create a Surprise</h1>

<p class="subtitle">
Create a special birthday surprise for someone.
</p>


<label>
Birthday person's full name
</label>

<input
    id="personName"
    type="text"
    placeholder="Example: Dehansa Hansadi"
>


<label>
Nickname
</label>

<input
    id="nickname"
    type="text"
    placeholder="Example: Hansi"
>


<label>
Your message
</label>

<textarea
    id="message"
    placeholder="Write your birthday message here..."
></textarea>


<label>
Choose a theme
</label>

<select id="theme">

<option value="pink">
Pink & Purple
</option>

<option value="blue">
Blue
</option>

<option value="dark">
Dark
</option>

</select>


<label>
Choose a photo
</label>

<input
    id="photo"
    type="file"
    accept="image/*"
>


<button onclick="createSurprise()">
Create Surprise
</button>


<div id="createError" class="error"></div>

</div>



<!-- ============================= -->
<!-- NAME CHECK PAGE -->
<!-- ============================= -->

<div id="checkPage" class="hidden">

<div class="heart">
♥
</div>

<h1>
A Little Surprise...
</h1>

<p class="subtitle">
Enter your name to see if this surprise is for you.
</p>


<input
    id="checkName"
    type="text"
    placeholder="Enter your name"
>


<button onclick="checkPerson()">
Continue
</button>


<div id="checkError" class="error"></div>

</div>



<!-- ============================= -->
<!-- SURPRISE PAGE -->
<!-- ============================= -->

<div id="surprisePage" class="hidden">

<div class="heart">
♥
</div>

<h1 id="surpriseTitle"></h1>

<p
    id="surpriseMessage"
    class="message">
</p>


<div
    id="photoContainer"
    class="photo-preview">
</div>


<button
    class="secondary"
    onclick="location.reload()">
Back
</button>

</div>


</div>


<script>


/* =================================
   DATA
================================= */

let surpriseData = {

    name: "",
    nickname: "",
    message: "",
    theme: "",
    photo: ""

};



/* =================================
   CREATE SURPRISE
================================= */

function createSurprise() {


    const name =
        document
        .getElementById("personName")
        .value
        .trim();


    const nickname =
        document
        .getElementById("nickname")
        .value
        .trim();


    const message =
        document
        .getElementById("message")
        .value
        .trim();


    const theme =
        document
        .getElementById("theme")
        .value;


    const photo =
        document
        .getElementById("photo")
        .files[0];


    const error =
        document
        .getElementById("createError");


    if (!name || !nickname || !message) {

        error.innerText =
            "Please fill in all the required fields.";

        return;

    }


    surpriseData.name = name;

    surpriseData.nickname = nickname;

    surpriseData.message = message;

    surpriseData.theme = theme;


    /* PHOTO */

    if (photo) {

        const reader =
            new FileReader();

        reader.onload = function(e) {

            surpriseData.photo =
                e.target.result;

            showCheckPage();

        };

        reader.readAsDataURL(photo);

    }

    else {

        showCheckPage();

    }

}



/* =================================
   SHOW CHECK PAGE
================================= */

function showCheckPage() {

    document
    .getElementById("createPage")
    .classList
    .add("hidden");


    document
    .getElementById("checkPage")
    .classList
    .remove("hidden");

}



/* =================================
   CHECK NAME
================================= */

function checkPerson() {


    const entered =
        document
        .getElementById("checkName")
        .value
        .trim()
        .toLowerCase();


    const correctName =
        surpriseData.name
        .toLowerCase();


    const nickname =
        surpriseData.nickname
        .toLowerCase();


    const error =
        document
        .getElementById("checkError");


    if (
        entered !== correctName &&
        entered !== nickname
    ) {

        error.innerText =
            "No no... This is not for you.";

        return;

    }


    showSurprise();

}



/* =================================
   SHOW SURPRISE
================================= */

function showSurprise() {


    document
    .getElementById("checkPage")
    .classList
    .add("hidden");


    document
    .getElementById("surprisePage")
    .classList
    .remove("hidden");


    document
    .getElementById("surpriseTitle")
    .innerText =
        "This is for you, " +
        surpriseData.nickname +
        "!";


    document
    .getElementById("surpriseMessage")
    .innerText =
        surpriseData.message;


    /* PHOTO */

    if (surpriseData.photo) {

        const img =
            document.createElement("img");

        img.src =
            surpriseData.photo;

        document
        .getElementById("photoContainer")
        .appendChild(img);

    }


    /* THEME */

    if (
        surpriseData.theme === "blue"
    ) {

        document.body.style.background =
            "linear-gradient(135deg,#c9e9ff,#d9d4ff)";

    }


    if (
        surpriseData.theme === "dark"
    ) {

        document.body.style.background =
            "linear-gradient(135deg,#1e1e2f,#3b2947)";

    }

}


</script>

</body>

</html>
